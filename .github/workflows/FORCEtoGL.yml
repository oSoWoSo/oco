name: ✂️GitLab
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  push-to-gitlab:
    name: ✂️GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO || 'https://gitlab.com/osowoso/oco.git' }}
          BRANCH: ${{ github.ref_name }}
          FORCE: "1"
        run: bash .github/scripts/ci/push-gitlab.sh
