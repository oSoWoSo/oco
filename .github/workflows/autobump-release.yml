name: 🚀 autobump release

on:
  workflow_run:
    workflows:
      - 🏗️ build
    types: [completed]
    branches:
      - autobump/**

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

jobs:
  prepare:
    name: Validate, merge and prepare release request
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'autobump/') &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: autobump-release-merge
      cancel-in-progress: false
      queue: max
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
    steps:
      - name: Checkout trusted OCO source
        uses: actions/checkout@v7
        with:
          ref: OCO
          path: extra
          fetch-depth: 2

      - name: Download completed PR build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: autobump-*
          merge-multiple: false
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate PR and stage verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 extra/src/autobump-release.py prepare --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --artifacts "$GITHUB_WORKSPACE/artifacts" --staging "$RUNNER_TEMP/autobump-staging"

      - name: Merge exact tested PR revision
        id: merge
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
        run: |
          python3 extra/src/autobump-release.py merge --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY" --staging "$RUNNER_TEMP/autobump-staging"

      - name: Checkout merged OCO tree
        env:
          CHECKOUT_DIR: extra
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: extra/.github/scripts/ci/autobump-release-checkout-merge.sh

      - name: Assemble publication request
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: extra/.github/scripts/ci/autobump-release-assemble.sh

      - uses: actions/upload-artifact@v7
        with:
          name: surfer-publication
          path: ${{ runner.temp }}/surfer-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: prepare
    uses: ./.github/workflows/write-surfer.yml
    with:
      destination: production
      artifact_name: surfer-publication
    secrets: inherit

  close-issues:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: OCO
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: surfer-publication
          path: publication
      - name: Close resolved package issues
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLICATION_DIR: publication
        run: .github/scripts/ci/autobump-release-close-issues.sh

