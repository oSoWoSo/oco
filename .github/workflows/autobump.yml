name: autobump

# Rewrites a template's version= / revision= / checksum= and opens a PR.
#
#
#   detect-update.sh  candidate version, from the template's `update` file
#   bump-template.sh  version=/revision=/checksum= rewrite
#
# Why not xxautobump: that path bootstrapped a full masterdir (~10 min, needs
# --privileged) just to run `xbps-src update-check` (4.5 s for the whole
# whitelist) and `xgensum -i`, and xgensum needs a bootstrapped masterdir only
# because of its own plumbing -- the whitelist templates all use plain sha256
# digests, so sha256sum over the distfiles is enough.

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Package name to autobump'
        required: true
        type: string
      force:
        description: 'Ignore src/autobump-pkgs whitelist'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autobump-${{ inputs.pkg || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autobump:
    name: Autobump ${{ inputs.pkg || github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'package-update')
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      OCO_TOKEN: ${{ secrets.BOT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Extract template from issue body
        id: template
        env:
          INPUT_PKG: ${{ inputs.pkg }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PKG" ]; then
            PKG=$INPUT_PKG
          else
            PKG=$(printf '%s\n' "$ISSUE_BODY" |
              sed -n 's|.*\*\*Package:\*\*[^`]*`\([^`]*\)`.*|\1|p' |
              sed -n '1p')
            [ -n "$PKG" ] || PKG=$(printf '%s\n' "$ISSUE_BODY" |
              sed -n 's|.*<!-- package-update:\([^>]*\) -->.*|\1|p' |
              sed -n '1p')
            PKG=$(printf '%s' "$PKG" | tr -d '[:space:]')
            [ -n "$PKG" ] || {
              echo "::error::could not extract package name from issue body"
              exit 1
            }
          fi

          # Resolve the real template name case-insensitively.
          found=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -iname "$PKG" -printf '%f\n' | head -1)
          [ -n "$found" ] || {
            echo "::error::template not found in srcpkgs: $PKG"
            exit 1
          }

          # srcpkgs contains symlinked aliases (libpng-devel, sfizz-*,
          # hyprland-devel). They share a directory with their real template,
          # so bumping "libfoo-devel" would rewrite libfoo.
          if [ -L "srcpkgs/$found" ]; then
            echo "::error::srcpkgs/$found is a symlinked alias, refusing to bump it"
            exit 1
          fi

          echo "TEMPLATE=$found" >>"$GITHUB_ENV"
          echo "template=$found" >>"$GITHUB_OUTPUT"

      - name: Skip if dismissed or already handled
        id: marker
        env:
          GH_TOKEN: ${{ secrets.BOT }}
        run: |
          set -euo pipefail

          handled=false

          request_ver=$(printf '%s\n' "$ISSUE_BODY" |
            sed -n 's|.*<!-- upstream-version:\([^>]*\) -->.*|\1|p' | sed -n '1p')
          [ -n "$request_ver" ] || request_ver=$(printf '%s\n' "$ISSUE_BODY" |
            sed -n 's|.*\*\*Upstream version:\*\*[^`]*`\([^`]*\)`.*|\1|p' | sed -n '1p')
          echo "request_ver=$request_ver" >>"$GITHUB_OUTPUT"

          if [ -n "$ISSUE_BODY" ] && printf '%s\n' "$ISSUE_BODY" | grep -q '<!-- autobump:no -->'; then
            echo "Feed-only issue ($TEMPLATE is not in src/autobump-pkgs): nothing to do"
            echo "handled=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$ISSUE_NUMBER" ] && [ -z "$request_ver" ]; then
            echo "::error::package-update issue is missing an upstream version marker/heading"
            exit 1
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            comments=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body')

            # A `nobump` comment is a deliberate "not this time": re-running
            # from an `edited` event must not undo that decision.
            if printf '%s\n' "$comments" | grep -qiE '^> *nobump *$|^nobump *$'; then
              echo "Issue dismissed with a nobump comment"
              handled=true
            elif [ -n "$request_ver" ] &&
              { printf '%s\n' "$comments" | grep -qF "<!-- autobump:skip for $request_ver -->" ||
                printf '%s\n' "$comments" | grep -qF "<!-- autobump:done for $request_ver -->"; }
            then
              echo "Already handled for $request_ver: skipping"
              handled=true
            fi
          else
            # workflow_dispatch has no comment trail, so check for an open PR
            # from any autobump/<pkg>-* branch instead -- otherwise every
            # manual re-run files another PR for a version that is already
            # proposed.
            existing=$(gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.ref | startswith(\"autobump/${TEMPLATE}-\")) | .number" |
              sed -n '1p')
            if [ -n "$existing" ]; then
              echo "Autobump PR #$existing is already open"
              handled=true
            fi
          fi

          echo "handled=$handled" >>"$GITHUB_OUTPUT"

      - name: Whitelist check
        id: whitelist
        if: steps.marker.outputs.handled == 'false'
        env:
          FORCE: ${{ inputs.force }}
          REQUEST_VER: ${{ steps.marker.outputs.request_ver }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ] || grep -qxF "$TEMPLATE" src/autobump-pkgs; then
            echo "in_list=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "in_list=false" >>"$GITHUB_OUTPUT"

          if [ -n "$ISSUE_NUMBER" ]; then
            if [ -z "$REQUEST_VER" ]; then
              echo "::error::cannot post a version-scoped skip marker without REQUEST_VER"
              exit 1
            fi
            printf 'Autobump skipped: **%s** is not listed in `src/autobump-pkgs`.\n\nAdd the template there to enable automatic updates.\n\n<!-- autobump:skip for %s -->\n' \
              "$TEMPLATE" "$REQUEST_VER" >"$RUNNER_TEMP/comment.md"
            gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments" \
              --method POST -F body=@"$RUNNER_TEMP/comment.md" || true
          else
            echo "Autobump skipped: $TEMPLATE not in src/autobump-pkgs (use force to override)"
          fi

      - name: Detect newer version
        id: detect
        if: steps.whitelist.outputs.in_list == 'true'
        timeout-minutes: 10
        env:
          # llama.cpp's `update` file points at api.github.com, which allows
          # 60 unauthenticated requests per hour and runner IP.
          GITHUB_TOKEN: ${{ secrets.BOT }}
        run: |
          set -euo pipefail

          err=$(mktemp)
          set +e
          out=$(.github/scripts/detect-update.sh "$TEMPLATE" "$GITHUB_WORKSPACE" 2>"$err")
          rc=$?
          set -e

          cat "$err"
          if [ "$rc" -ge 2 ]; then
            echo "::error::detection failed for $TEMPLATE (rc=$rc)"
            exit 1
          fi

          if [ -z "$out" ]; then
            echo "new=" >>"$GITHUB_OUTPUT"
            echo "$TEMPLATE is up to date"
            exit 0
          fi

          read -r _pkg _old new <<<"$out"
          echo "new=$new" >>"$GITHUB_OUTPUT"
          echo "$TEMPLATE -> $new"

      - name: Bump template
        id: bump
        if: steps.whitelist.outputs.in_list == 'true' && steps.detect.outputs.new != ''
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.BOT }}
          NEW_VERSION: ${{ steps.detect.outputs.new }}
        run: |
          set -euo pipefail

          .github/scripts/bump-template.sh "$TEMPLATE" "$NEW_VERSION"

          version=$(sed -n 's|^version=||p' "srcpkgs/$TEMPLATE/template" | head -1 | tr -d '"')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "bumped=true" >>"$GITHUB_OUTPUT"

      - name: Comment when nothing to bump
        if: steps.marker.outputs.handled == 'false' && steps.whitelist.outputs.in_list == 'true' && steps.bump.outputs.bumped != 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          NEW_VERSION: ${{ steps.detect.outputs.new }}
          REQUEST_VER: ${{ steps.marker.outputs.request_ver }}
        run: |
          set -euo pipefail

          detail=""
          if [ -n "$NEW_VERSION" ]; then
            detail="Already at $NEW_VERSION."
          else
            detail="No newer version found."
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            if [ -z "$REQUEST_VER" ]; then
              REQUEST_VER=$(sed -n 's|^version=||p' "srcpkgs/$TEMPLATE/template" | head -1 | tr -d '"')
            fi
            [ -n "$REQUEST_VER" ] || { echo "::error::cannot determine version for skip marker"; exit 1; }
            printf 'Autobump: nothing to do for **%s**. %s\n\n<!-- autobump:skip for %s -->\n' \
              "$TEMPLATE" "$detail" "$REQUEST_VER" >"$RUNNER_TEMP/comment.md"
            gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments" \
              --method POST -F body=@"$RUNNER_TEMP/comment.md" || true
          else
            echo "Autobump: nothing to do for ${TEMPLATE}. ${detail}"
          fi

      - name: Create branch + push
        id: branch
        if: steps.marker.outputs.handled == 'false' && steps.whitelist.outputs.in_list == 'true' && steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="autobump/${TEMPLATE}-${VERSION}"
          TPL="srcpkgs/$TEMPLATE/template"

          git config user.name "oSoWoSo-bot"
          git config user.email "mail@osowoso.org"

          # The checkout is depth 1 and pinned to the SHA at event time. Its
          # .github/workflows/build.yml blob can differ from the live default
          # branch, and GitHub refuses an App token that creates a branch
          # carrying a modified workflow file:
          #   "refusing to allow a GitHub App to create or update workflow
          #    .github/workflows/build.yml without workflows permission"
          # Rebasing onto the live OCO tip makes the blob identical, so the
          # commit below only ever touches srcpkgs/<pkg>/template.
          bumped=$(mktemp)
          cp "$TPL" "$bumped"

          git fetch --no-tags --depth=1 origin "+refs/heads/OCO:refs/remotes/origin/OCO"
          git checkout -B "$BRANCH" refs/remotes/origin/OCO
          cp "$bumped" "$TPL"

          git add "$TPL"
          if git diff --cached --quiet; then
            echo "::error::rebase onto OCO left ${TPL} unchanged; nothing to bump"
            exit 1
          fi

          git commit -m "$TEMPLATE $VERSION"

          # Re-running the same bump (a retried job, a second issue for the
          # same release) must not die on a non-fast-forward push. The branch
          # carries nothing but this one template file, so replacing it is
          # safe and keeps the PR list free of duplicates.
          git push --force "https://x-access-token:${OCO_TOKEN}@github.com/${GH_REPO}.git" "HEAD:${BRANCH}"

          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >>"$GITHUB_ENV"
          echo "branch=$BRANCH" >>"$GITHUB_OUTPUT"

      - name: Open PR
        id: pr
        if: steps.marker.outputs.handled == 'false' && steps.whitelist.outputs.in_list == 'true' && steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT }}
        run: |
          set -euo pipefail

          printf '**%s** %s' "$TEMPLATE" "$VERSION" >"$RUNNER_TEMP/pr-body.md"
          if [ -n "$ISSUE_NUMBER" ]; then
            printf '\n\nCloses #%s' "$ISSUE_NUMBER" >>"$RUNNER_TEMP/pr-body.md"
          fi

          # An open PR for this exact branch is the retry case, not an error.
          if existing=$(gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.ref == \"${BRANCH}\") | .number" | sed -n '1p') &&
            [ -n "$existing" ]; then
            echo "number=$existing" >>"$GITHUB_OUTPUT"
            echo "PR #${existing} already open"
            exit 0
          fi

          number=$(gh api "repos/${GH_REPO}/pulls" \
            --method POST \
            -f title="${TEMPLATE} ${VERSION}" \
            -f head="$BRANCH" \
            -f base=OCO \
            -F body=@"$RUNNER_TEMP/pr-body.md" \
            --jq '.number')

          echo "number=$number" >>"$GITHUB_OUTPUT"
          echo "PR: #${number}"

      - name: Comment on issue
        if: github.event_name != 'workflow_dispatch' && steps.marker.outputs.handled == 'false' && steps.whitelist.outputs.in_list == 'true' && steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REQUEST_VER: ${{ steps.marker.outputs.request_ver }}
        run: |
          set -euo pipefail

          if [ -n "$PR_NUMBER" ]; then
            if [ -z "$REQUEST_VER" ]; then
              REQUEST_VER=$VERSION
            fi
            [ -n "$REQUEST_VER" ] || { echo "::error::cannot determine version for done marker"; exit 1; }
            printf 'PR opened: **%s** -> #%s.\n\n<!-- autobump:done for %s -->\n' \
              "$TEMPLATE" "$PR_NUMBER" "$REQUEST_VER" >"$RUNNER_TEMP/comment.md"
            gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments" \
              --method POST -F body=@"$RUNNER_TEMP/comment.md" || true
          fi
