name: 🏗️ build
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    (inputs.all == 'true' && '🏗️ all' ||
     inputs.template != '' && format('🏗️ {0}', inputs.template) ||
     inputs.templates != '' && format('🏗️ {0}', inputs.templates)) ||
    github.event_name == 'push' && format('🏗️ {0}', github.event.head_commit.message) ||
    github.event_name == 'pull_request' &&
    format('{0} (#{1})', github.event.pull_request.title, github.event.pull_request.number) ||
    '🏗️'
  }}
on:
  push:
    branches:
      - '**'
      - '!WIP'
      - '!WIP/**'
      - '!autobump/**'
    paths:
      - 'srcpkgs/**'
  pull_request:
    branches:
      - OCO
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: false
        type: choice
        default: auto
        options:
        - auto
        - amd64
        - arm64
        - nocross
        - self-hosted
      all:
        description: 'Everything'
        required: false
        default: false
        type: boolean
