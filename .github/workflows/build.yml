# Apply changes in src/build.yml.in instead.
# .github/workflows/build.yml is generated from this file by `ocoman -u`.
permissions:
  actions: read
  contents: write
  pull-requests: read
  packages: read
  issues: write

jobs:
  detect:
    name: detect
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      removed: ${{ steps.detect.outputs.removed }}
      matrix: ${{ steps.detect.outputs.matrix }}
      publish_target: ${{ steps.detect.outputs.publish_target }}
      repository_prefix: ${{ steps.detect.outputs.repository_prefix }}
      skip_autobump: ${{ steps.detect.outputs.skip_autobump }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Need full history so we can diff against arbitrary base SHAs
          # (multi-commit pushes, force-pushes, PR bases).
          fetch-depth: 23

      - name: Fetch OCO base
        run: git fetch --no-tags --depth=1 origin "+refs/heads/OCO:refs/remotes/origin/OCO" || true

      - name: Detect changed packages
        id: detect
        env:
          INPUT_ALL: ${{ inputs.all }}
          INPUT_TEMPLATE: ${{ inputs.template }}
          INPUT_TEMPLATES: ${{ inputs.templates }}
          INPUT_RUNNER: ${{ inputs.runner || 'auto' }}
          INPUT_PUBLISH_TARGET: ${{ inputs.publish_target || 'production' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          . src/pkg-helpers.sh
          packages=""
          removed=""

          # Debug output
          echo "DEBUG: INPUT_ALL=$INPUT_ALL"
          echo "DEBUG: INPUT_TEMPLATE=$INPUT_TEMPLATE"
          echo "DEBUG: EVENT_NAME=$EVENT_NAME"
          echo "DEBUG: CURRENT_BRANCH=$CURRENT_BRANCH"
          echo "DEBUG: PUSH_BEFORE=$PUSH_BEFORE"
          echo "DEBUG: PUSH_AFTER=$PUSH_AFTER"

          # Auto-merged autobump PRs are published from their successful PR
          # artifacts by autobump-release.yml. Never compile them again on OCO.
          skip_autobump=false
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/OCO ]; then
            _message=$(git log -1 --format=%B "$PUSH_AFTER")
            if printf '%s\n' "$_message" | grep -Eq '^OCO-Autobump-Run: [0-9]+$'; then
              _associated=''
              for _try in 1 2 3 4 5; do
                _associated=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PUSH_AFTER}/pulls?per_page=100" \
                  | jq -r --arg repo "$GITHUB_REPOSITORY" \
                    '.[] | select(.merged_at != null and .base.ref == "OCO" and .head.repo.full_name == $repo and (.user.login == "oSoWoSo-bot" or .user.login == "zen0bit" or .user.login == "zenobit") and (.head.ref | startswith("autobump/"))) | .number' \
                  ) && [ -n "$_associated" ] && break
                sleep 3
              done
              if [ -z "$_associated" ]; then
                echo "::error::Autobump merge marker present, but no matching merged PR was verified"
                exit 1
              fi
              echo "Autobump merge #${_associated} uses PR build artifacts; skip recompilation"
              skip_autobump=true
            fi
          fi
          echo "skip_autobump=$skip_autobump" >> "$GITHUB_OUTPUT"

          # Fail closed: only an exact OCO ref may publish production, and
          # only ordinary OCO pushes are implicitly production. Dispatch must
          # explicitly choose production; repository_dispatch stays testing.
          publish_target=testing
          if [ "$GITHUB_REF" = "refs/heads/OCO" ]; then
            if [ "$EVENT_NAME" = push ] || \
               { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$INPUT_PUBLISH_TARGET" = production ]; }; then
              publish_target=production
            fi
          fi
          repository_prefix=testing
          [ "$publish_target" = production ] && repository_prefix=''
          echo "publish_target=$publish_target" >> "$GITHUB_OUTPUT"
          echo "repository_prefix=$repository_prefix" >> "$GITHUB_OUTPUT"

          ZERO_SHA="0000000000000000000000000000000000000000"
          all_packages() {
            list_srcpkgs srcpkgs | tr '\n' ' ' | sed 's/ $//'
          }

          if [ "$INPUT_ALL" = "true" ]; then
            packages=$(all_packages)
          elif [ -n "$INPUT_TEMPLATE" ]; then
            packages="$INPUT_TEMPLATE"
          elif [ -n "$INPUT_TEMPLATES" ]; then
            packages=$(printf '%s ' $INPUT_TEMPLATES | sed 's/ $//')
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            UNCERTAIN_OCO_BASE=false
            if [ "$EVENT_NAME" = "pull_request" ]; then
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
            else
              HEAD_SHA="$PUSH_AFTER"
              if [ "$CURRENT_BRANCH" = "OCO" ]; then
                # Push event SHAs are immutable. Do not substitute the moving
                # branch tip (or HEAD^) when the exact before commit is absent.
                if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$ZERO_SHA" ]; then
                  UNCERTAIN_OCO_BASE=true
                else
                  if ! git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                    git fetch --no-tags origin "$PUSH_BEFORE" >/dev/null 2>&1 || true
                  fi
                  if git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                    BASE_SHA="$PUSH_BEFORE"
                  else
                    UNCERTAIN_OCO_BASE=true
                  fi
                fi
              else
                BASE_SHA="$ZERO_SHA"
              fi
            fi
            echo "DEBUG: BASE_SHA=$BASE_SHA"
            echo "DEBUG: HEAD_SHA=$HEAD_SHA"
            if [ "$UNCERTAIN_OCO_BASE" = "true" ]; then
              echo "::warning::OCO push before SHA is zero or unavailable; building all packages without inferring removals"
              packages=$(all_packages)
            elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ] \
                || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              echo "No direct diff base; reading origin/OCO .gitignore for package list"
              _main_list=$(git show origin/OCO:.gitignore 2>/dev/null | sed -n 's|^!/srcpkgs/\([^/]*\)/*$|\1|p' | sort -fu || true)
              if [ -n "$_main_list" ]; then
                _current_list=$(list_srcpkgs srcpkgs)
                _added=$(  grep -Fxvf <(printf '%s\n' "$_main_list") <(printf '%s\n' "$_current_list") || true)
                _removed=$(grep -Fxvf <(printf '%s\n' "$_current_list") <(printf '%s\n' "$_main_list") || true)
                removed=$(printf '%s\n' "$_removed" | tr '\n' ' ' | sed 's/ $//')
                _common=$( grep -Fxf  <(printf '%s\n' "$_main_list") <(printf '%s\n' "$_current_list") || true)
                _modified=""
                for _pkg in $_common; do
                  if git show origin/OCO:srcpkgs/$_pkg/template 2>/dev/null \
                      | diff -q - srcpkgs/$_pkg/template >/dev/null 2>&1; then
                    :
                  else
                    _modified="$_modified$_pkg "
                  fi
                done
                packages=$(printf '%s\n%s' "$_added" "$_modified" | grep -v '^$' | tr '\n' ' ' | sed 's/ $//')
              else
                echo "  Warning: origin/OCO:.gitignore empty or not found; building all packages"
                packages=$(all_packages)
              fi
            else
              _diff=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'srcpkgs/*')
              packages=$(printf '%s\n' "$_diff" \
                | awk '$1 ~ /^[ACMR]/ { if (substr($1,1,1)=="R") print $3; else print $2 }' \
                | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')
              removed=$(printf '%s\n' "$_diff" \
                | awk '$1=="D"{print $2} $1~/^R/{print $2}' \
                | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')
            fi
          else
            packages=$(all_packages)
          fi

          _filtered=""
          for _pkg in $packages; do
            if [ -L "srcpkgs/$_pkg" ]; then
              echo "::warning::$_pkg is an alias for $(basename "$(readlink "srcpkgs/$_pkg")"), skipping"
              continue
            fi
            _filtered="$_filtered $_pkg"
          done
          packages="${_filtered# }"

          echo "Packages: ${packages:-<none>}"
          echo "Removed: ${removed:-<none>}"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          ref="${GITHUB_REF_NAME//\//%2F}"
          echo "| Package | version | template |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          for pkg in $packages; do
            version=$(grep '^version=' "srcpkgs/${pkg}/template" | cut -d '=' -f2)
            echo "| $pkg | $version | [template](${repo}/blob/${ref}/srcpkgs/${pkg}/template) |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Topological build order: show inter-package deps within the detected set
          _topo_pkg_deps() {
            local _pkg="$1" _tpl="srcpkgs/$1/template" _field _line _dep _dep_name
            [ -f "$_tpl" ] || return 0
            for _field in hostmakedepends makedepends depends; do
              _line=$(grep -m1 "^${_field}=" "$_tpl" 2>/dev/null || true)
              _line="${_line#*=}"; _line="${_line#\"}"; _line="${_line%\"}"; _line="${_line#\'}"; _line="${_line%\'}"
              for _dep in $_line; do
                _dep_name="${_dep%%[><=]*}"
                [ -z "$_dep_name" ] && continue
                case " $packages " in *" $_dep_name "*) echo "$_dep_name" ;; esac
              done
            done
          }
          _topo_visited=""; _topo_sorted=""
          _topo_visit() {
            local _v="$1"
            case " $_topo_visited " in *" $_v "*) return ;; esac
            _topo_visited="$_topo_visited $_v"
            for _d in $(_topo_pkg_deps "$_v"); do _topo_visit "$_d"; done
            _topo_sorted="$_topo_sorted $_v"
          }
          for _p in $packages; do _topo_visit "$_p"; done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### build order" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          _ord=1
          for _p in $_topo_sorted; do
            # Subpackage template-symlinks are reported under their parent below;
            # skip them here unless their parent is not in the detected set.
            if [ -L "srcpkgs/$_p" ]; then
              _p_parent=$(readlink "srcpkgs/$_p")
              case " $_topo_sorted " in *" $_p_parent "*) continue ;; esac
            fi
            _deps=$(_topo_pkg_deps "$_p" | sort -u | tr '\n' ' ' | sed 's/ $//')
            if [ -n "$_deps" ]; then
              echo "${_ord}. **${_p}** ← ${_deps}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${_ord}. **${_p}**" >> "$GITHUB_STEP_SUMMARY"
            fi
            _ord=$((_ord + 1))
          done

          # Subpackages = symlinks in srcpkgs/ pointing at a listed package's template dir,
          # grouped under their parent package.
          _sub_parents=""
          for _p in $_topo_sorted; do
            [ -L "srcpkgs/$_p" ] && continue
            for _sp in srcpkgs/*; do
              [ -L "$_sp" ] || continue
              [ "$(readlink "$_sp")" = "$_p" ] && { _sub_parents="$_sub_parents $_p"; break; }
            done
          done
          if [ -n "$_sub_parents" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### subpackages" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for _p in $_sub_parents; do
              _children=""
              for _sp in srcpkgs/*; do
                [ -L "$_sp" ] || continue
                [ "$(readlink "$_sp")" = "$_p" ] && _children="$_children ${_sp##*/}"
              done
              echo "**${_p}**:" >> "$GITHUB_STEP_SUMMARY"
              for _c in $_children; do
                echo "- $_c" >> "$GITHUB_STEP_SUMMARY"
              done
            done
          fi

          if [ -n "$removed" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Removed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for pkg in $removed; do
              echo "$pkg" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          arch_needed() {
            local target="$1"
            for pkg in $packages; do
              pkg_arch_ok "$pkg" "$target" && return 0
            done
            return 1
          }

          needs_cross() {
            local target="$1"
            _cnc_visited=""
            local any_nocross=0
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              pkg_arch_ok "$pkg" "$target" || continue
              _check_nocross_chain "$pkg" && any_nocross=1
            done
            [ "$any_nocross" = 0 ] && arch_needed "$target"
          }

          needs_native() {
            local target="$1"
            _cnc_visited=""
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              _check_nocross_chain "$pkg" || continue
              pkg_arch_ok "$pkg" "$target" && return 0
            done
            return 1
          }

          add_cfg() {
            [ -n "$matrix_configs" ] && matrix_configs="${matrix_configs},"
            matrix_configs="${matrix_configs}{\"arch\":\"$1\",\"host\":\"$2\",\"runner\":\"$3\",\"platform\":\"$4\",\"test\":$5,\"native\":$6}"
          }

          _RUNNER="${INPUT_RUNNER:-auto}"
          case "$_RUNNER" in
            amd64)
              _amd64=$(arch_needed "x86_64" && echo 1 || echo 0)
              _musl=$(arch_needed "x86_64-musl" && echo 1 || echo 0)
              matrix_configs=""
              [ "$_amd64" = 1 ]           && add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              [ "$_musl"  = 1 ]           && add_cfg "x86_64-musl"  "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for amd64 archs, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                                             add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              fi
              ;;
            arm64)
              _arm_native=$(arch_needed "aarch64" && echo 1 || echo 0)
              _arm_musl=$(arch_needed "aarch64-musl" && echo 1 || echo 0)
              matrix_configs=""
              [ "$_arm_native" = 1 ]      && add_cfg "aarch64"      "aarch64" "ubuntu-24.04-arm" "linux/arm64" 1 true
              [ "$_arm_musl"  = 1 ]      && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for arm64 archs, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                                             add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              fi
              ;;
            nocross)
              matrix_configs=""
              arch_needed "x86_64"        && add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              arch_needed "aarch64"       && add_cfg "aarch64"      "aarch64" "ubuntu-24.04-arm" "linux/arm64" 1 true
              arch_needed "x86_64-musl"   && add_cfg "x86_64-musl"  "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              arch_needed "aarch64-musl"  && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for any arch, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                                             add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              fi
              ;;
            self-hosted)
              matrix_configs=""
              arch_needed "x86_64"        && add_cfg "x86_64"       "x86_64"  "self-hosted"      "linux/amd64" 1 false
              needs_cross "aarch64"       && add_cfg "aarch64"      "x86_64"  "self-hosted"      "linux/amd64" 0 false
              arch_needed "x86_64-musl"   && add_cfg "x86_64-musl"  "x86_64"  "self-hosted"      "linux/amd64" 1 false
              needs_cross "aarch64-musl"  && add_cfg "aarch64-musl" "x86_64"  "self-hosted"      "linux/amd64" 0 false
              needs_native "aarch64"      && add_cfg "aarch64"      "aarch64" "self-hosted"      "linux/arm64" 1 true
              needs_native "aarch64-musl" && add_cfg "aarch64-musl" "aarch64-musl" "self-hosted"      "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no arch matched package list, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                                             add_cfg "x86_64"       "x86_64"  "self-hosted"      "linux/amd64" 1 false
              fi
              ;;
            auto|*)
              matrix_configs=""
              arch_needed "x86_64"        && add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              needs_cross "aarch64"       && add_cfg "aarch64"      "x86_64"  "ubuntu-latest"    "linux/amd64" 0 false
              arch_needed "x86_64-musl"   && add_cfg "x86_64-musl"  "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              needs_cross "aarch64-musl"  && add_cfg "aarch64-musl" "x86_64"  "ubuntu-latest"    "linux/amd64" 0 false
              needs_native "aarch64"      && add_cfg "aarch64"      "aarch64" "ubuntu-24.04-arm" "linux/arm64" 1 true
              needs_native "aarch64-musl" && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no arch matched package list, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                                             add_cfg "x86_64"       "x86_64"  "ubuntu-latest"    "linux/amd64" 1 false
              fi
              ;;
          esac
          echo "matrix={\"config\":[${matrix_configs}]}" >> "$GITHUB_OUTPUT"

  test-pr:
    name: ${{ matrix.config.arch }} on ${{ matrix.config.host }}
    permissions:
      contents: read
      packages: read
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.packages != ''
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 240
    container:
      image: ghcr.io/osowoso/oco-builder-${{ matrix.config.host }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: '${{ matrix.config.arch }}'
        BOOTSTRAP: '${{ matrix.config.host }}'
        TEST: '${{ matrix.config.test }}'
        NATIVE: '${{ matrix.config.native }}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout repo (PR head)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: extra

      - name: Prepare container
        run: oco-prepare

      - name: Merge templates and edit shlibs
        run: |
          SHLIBS_FILE=/void-packages/common/shlibs extra/ocoman -l

          echo "==> Copying templates..."
          for template in extra/srcpkgs/*; do
            template_name=$(basename "$template")
            [ -L "$template" ] && continue
            rm -rf "/void-packages/srcpkgs/$template_name"
            cp -rv "$template" /void-packages/srcpkgs/
          done
          for template in extra/srcpkgs/*; do
            [ -L "$template" ] || continue
            template_name=$(basename "$template")
            target_name=$(readlink "$template")
            case "$target_name" in
              */*|.|..) continue ;;
            esac
            target="extra/srcpkgs/$target_name"
            [ -d "$target" ] && [ ! -L "$target" ] && [ -f "$target/template" ] || continue
            rm -rf "/void-packages/srcpkgs/$template_name"
            ln -s "$target_name" "/void-packages/srcpkgs/$template_name"
          done
          chown -R builder:builder /void-packages/srcpkgs /void-packages/common

      - name: Lint templates
        if: matrix.config.arch == 'x86_64'
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          packages="$PACKAGES"
          cd /void-packages
          failed=0

          for template_name in $packages; do
            echo "==> Linting ${template_name}"
            if OUTPUT=$(sudo -Eu builder xlint "${template_name}" 2>&1); then
              LINT_RC=0
            else
              LINT_RC=$?
            fi
            if [ "$LINT_RC" -ne 0 ] || [ -n "$OUTPUT" ]; then
              failed=1
              echo "❌ ${template_name} lint failed:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "${OUTPUT:-xlint exited with status $LINT_RC and produced no output}" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "❌ ${template_name} (exit $LINT_RC): ${OUTPUT:-no output}"
            else
              echo "✅ ${template_name} lint passed"
            fi
          done
          exit "$failed"

      - name: Snapshot existing binaries
        if: startsWith(github.head_ref, 'autobump/') && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 extra/src/autobump-binaries.py snapshot \
            --binpkgs /void-packages/hostdir/binpkgs \
            --snapshot "$RUNNER_TEMP/autobump-before.json"

      - name: Build packages
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
          RESULT_FILE: ${{ runner.temp }}/results.tsv
        run: sh "${GITHUB_WORKSPACE}/extra/src/build-packages.sh"

      - name: Collect new autobump binaries
        if: success() && startsWith(github.head_ref, 'autobump/') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_ARCH: ${{ matrix.config.arch }}
          TARGET_HOST: ${{ matrix.config.host }}
        run: |
          python3 extra/src/autobump-binaries.py collect \
            --binpkgs /void-packages/hostdir/binpkgs \
            --snapshot "$RUNNER_TEMP/autobump-before.json" \
            --arch "$TARGET_ARCH" --host "$TARGET_HOST" \
            --results "$RUNNER_TEMP/results.tsv" \
            --output "$RUNNER_TEMP/autobump-out"

      - name: Upload autobump binaries
        if: success() && startsWith(github.head_ref, 'autobump/') && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: autobump-bin-${{ matrix.config.arch }}-${{ matrix.config.host }}
          path: ${{ runner.temp }}/autobump-out/
          if-no-files-found: error
          retention-days: 7

  build-gate:
    name: 🏗️ build gate
    permissions:
      contents: read
    needs: [detect, test-pr]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify required autobump build
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_RESULT: ${{ needs.test-pr.result }}
          PACKAGES: ${{ needs.detect.outputs.packages }}
          REMOVED: ${{ needs.detect.outputs.removed }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" != OCO || "$HEAD_REF" != autobump/* ]]; then
            echo "Build not required for this PR"
            exit 0
          fi
          [[ "$DETECT_RESULT" == success && "$TEST_RESULT" == success && -n "$PACKAGES" && -z "$REMOVED" ]] || {
            echo "::error::Autobump package build/detection failed or no packages were detected"
            exit 1
          }
          echo "All autobump architecture builds passed"

      - name: Write autobump release plan
        if: >-
          ${{ startsWith(github.event.pull_request.head.ref, 'autobump/') &&
              github.event.pull_request.base.ref == 'OCO' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MATRIX_JSON: ${{ needs.detect.outputs.matrix }}
          PACKAGES: ${{ needs.detect.outputs.packages }}
          REMOVED: ${{ needs.detect.outputs.removed }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = {
              'pr_number': int(os.environ['PR_NUMBER']),
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['PR_HEAD_SHA'],
              'base_sha': os.environ['PR_BASE_SHA'],
              'head_ref': os.environ['PR_HEAD_REF'],
              'packages': os.environ['PACKAGES'],
              'removed': os.environ['REMOVED'],
              'matrix': json.loads(os.environ['MATRIX_JSON']),
          }
          Path('release.json').write_text(json.dumps(plan, indent=2) + '\n')
          PY

      - name: Upload autobump release plan
        if: >-
          ${{ startsWith(github.event.pull_request.head.ref, 'autobump/') &&
              github.event.pull_request.base.ref == 'OCO' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v7
        with:
          name: autobump-release-plan
          path: release.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.config.arch }} on ${{ matrix.config.host }}
    needs: detect
    if: (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && needs.detect.outputs.skip_autobump != 'true' && (needs.detect.outputs.packages != '' || needs.detect.outputs.removed != '')
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 330
    container:
      image: ghcr.io/osowoso/oco-builder-${{ matrix.config.host }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: '${{ matrix.config.arch }}'
        BOOTSTRAP: '${{ matrix.config.host }}'
        TEST: '${{ matrix.config.test }}'
        NATIVE: '${{ matrix.config.native }}'
        FORCE: '${{ inputs.force }}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}
          path: extra

      - name: Prepare container
        run: oco-prepare

      - name: Merge templates and edit shlibs
        run: |
          SHLIBS_FILE=/void-packages/common/shlibs extra/ocoman -l

          echo "==> Copying templates..."
          for template in extra/srcpkgs/*; do
            template_name=$(basename "$template")
            [ -L "$template" ] && continue
            rm -rf "/void-packages/srcpkgs/$template_name"
            cp -rv "$template" /void-packages/srcpkgs/
          done
          for template in extra/srcpkgs/*; do
            [ -L "$template" ] || continue
            template_name=$(basename "$template")
            target_name=$(readlink "$template")
            case "$target_name" in
              */*|.|..) continue ;;
            esac
            target="extra/srcpkgs/$target_name"
            [ -d "$target" ] && [ ! -L "$target" ] && [ -f "$target/template" ] || continue
            rm -rf "/void-packages/srcpkgs/$template_name"
            ln -s "$target_name" "/void-packages/srcpkgs/$template_name"
          done
          chown -R builder:builder /void-packages/srcpkgs /void-packages/common

      - name: Snapshot existing packages
        if: needs.detect.outputs.packages != ''
        run: |
          ls /void-packages/hostdir/binpkgs/*.xbps 2>/dev/null | xargs -r -n1 basename > /tmp/pre-build-pkgs.txt || touch /tmp/pre-build-pkgs.txt

      - name: Build packages
        id: build
        if: needs.detect.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
          RESULT_FILE: ${{ runner.temp }}/results.tsv
        run: sh "${GITHUB_WORKSPACE}/extra/src/build-packages.sh"

      - name: Upload per-arch build results
        if: always() && needs.detect.outputs.packages != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.config.arch }}
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
      - name: Stage newly built packages
        if: steps.build.outputs.built == 'true'
        working-directory: /void-packages/hostdir/binpkgs/
        run: |
          set -eu
          echo "==> Merging free + nonfree"
          [ -d nonfree ] && mv nonfree/*.xbps . 2>/dev/null || true
          out="$RUNNER_TEMP/packages/${{ matrix.config.arch }}"
          mkdir -p "$out"
          for pkg in ./*.xbps; do
            [ -f "$pkg" ] || continue
            base=$(basename "$pkg")
            grep -qxF "$base" /tmp/pre-build-pkgs.txt && continue
            cp "$pkg" "$out/"
          done

      - name: Upload newly built packages
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-packages-${{ matrix.config.arch }}
          path: ${{ runner.temp }}/packages/${{ matrix.config.arch }}/*.xbps
          if-no-files-found: ignore
          retention-days: 14

  publish-request:
    name: Prepare Surfer publication request
    needs: [detect, build]
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.detect.outputs.skip_autobump != 'true' &&
        github.event_name != 'pull_request' &&
        (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/incoming

      - name: Assemble publication artifact
        env:
          DESTINATION: ${{ needs.detect.outputs.publish_target }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          REMOVED: ${{ needs.detect.outputs.removed }}
          RESULTS: ${{ needs.detect.outputs.packages != '' }}
        run: |
          set -eu
          root="$RUNNER_TEMP/surfer-publication"
          mkdir -p "$root/packages" "$root/results"
          for dir in "$RUNNER_TEMP"/incoming/build-packages-*; do
            [ -d "$dir" ] || continue
            arch=${dir##*build-packages-}
            mkdir -p "$root/packages/$arch"
            cp "$dir"/*.xbps "$root/packages/$arch/" 2>/dev/null || rmdir "$root/packages/$arch"
          done
          for dir in "$RUNNER_TEMP"/incoming/build-results-*; do
            [ -d "$dir" ] || continue
            arch=${dir##*build-results-}
            [ -f "$dir/results.tsv" ] && cp "$dir/results.tsv" "$root/results/$arch.tsv"
          done
          python3 - "$root" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          arches = sorted(p.name for p in (root / "packages").iterdir() if p.is_dir())
          results = sorted(p.stem for p in (root / "results").glob("*.tsv"))
          purges = os.environ["REMOVED"].split()
          manifest = {"schema_version": 1, "destination": os.environ["DESTINATION"], "source_sha": os.environ["SOURCE_SHA"], "source_run_id": os.environ["SOURCE_RUN_ID"], "package_arches": arches, "result_arches": results, "purge_packages": purges, "update_arch_pages": True, "update_feed": True, "update_main_index": False}
          (root / "manifest.json").write_text(json.dumps(manifest) + "\n")
          if purges:
              (root / "purge-packages.txt").write_text("\n".join(purges) + "\n")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: surfer-publication
          path: ${{ runner.temp }}/surfer-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [detect, publish-request]
    uses: ./.github/workflows/write-surfer.yml
    with:
      destination: ${{ needs.detect.outputs.publish_target }}
      artifact_name: surfer-publication
    secrets: inherit

  close-update-issues:
    name: Close resolved update issues
    needs: [detect, publish]
    if: needs.detect.outputs.publish_target == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: build-results-*
          merge-multiple: false
          path: results
      - name: Close resolved package issues
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
          GH_REPO: ${{ github.repository }}
        run: python3 src/close-update-issues.py results --repo "$GH_REPO" --token "$GH_TOKEN"

