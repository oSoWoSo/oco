name: 📦 bumper
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && (inputs.pkg != '' && format('📦 {0}', inputs.pkg) ||
     format('📦 {0}', inputs.group)) ||
    github.event_name == 'issues' && format('📦 {0} (#{1})', github.event.issue.title, github.event.issue.number) ||
    '📦'
  }}
on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Single template to bump (opens a PR; supersedes group)'
        required: false
        type: string
      group:
        description: 'Group name to bump/lint (ignored when pkg is set)'
        required: true
        type: choice
        options:
          - cosmic
          - cosmic-minimal
          - dux
          - hypr
          - nwg
          - sonic
          - xlibre
          - xlibre-minimal
          - test
      bump:
        description: 'Bump'
        required: false
        default: false
        type: boolean
      lint:
        description: 'Lint'
        required: false
        default: false
        type: boolean
      order:
        description: 'Show build order'
        required: false
        default: false
        type: boolean
      record_order:
        description: 'Record build order'
        required: false
        default: false
        type: boolean
      base:
        description: 'Base branch to cut the bump branch and open the PR against (OCO or testing; pkg dispatch only)'
        required: false
        default: OCO
        type: choice
        options:
          - OCO
          - testing
      force:
        description: 'Bump even when the package is in config/autobump-blacklist (pkg dispatch only)'
        required: false
        default: false
        type: boolean
      automerge:
        description: 'Open as oSoWoSo-bot so a successful build auto-merges (pkg dispatch only)'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read

jobs:
  resolve:
    name: Resolve bump target
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       ((github.event.action == 'labeled' && github.event.label.name == 'package-update') ||
        (github.event.action == 'edited' && github.event.changes.body.from != null &&
         contains(github.event.issue.labels.*.name, 'package-update'))))
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      template: ${{ steps.template.outputs.template }}
      pack: ${{ steps.template.outputs.pack }}
      target: ${{ steps.template.outputs.target }}
    steps:
      - name: Decide operating mode
        id: mode
        env:
          INPUT_PKG: ${{ inputs.pkg }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            echo 'mode=autobump' >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_PKG" ]; then
            if [ "${{ inputs.bump }}" != true ] && [ "${{ inputs.lint }}" = true ]; then
              echo 'mode=lint' >> "$GITHUB_OUTPUT"
            else
              echo 'mode=autobump' >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "${{ inputs.bump }}" != true ] && [ "${{ inputs.lint }}" != true ] && \
               [ "${{ inputs.order }}" != true ] && [ "${{ inputs.record_order }}" != true ]; then
              echo '::error::select at least one operation flag (or dispatch with a pkg)'
              exit 1
            fi
            echo 'mode=group' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.mode.outputs.mode != 'group'

      - name: Load testing package inputs
        if: inputs.base == 'testing' && steps.mode.outputs.mode != 'group'
        run: bash .github/scripts/autobump-use-testing.sh

      - name: Resolve the template and pack
        id: template
        if: steps.mode.outputs.mode != 'group'
        env:
          INPUT_PKG: ${{ inputs.pkg }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash .github/scripts/autobump-template.sh

  bump:
    name: 📦 ${{ needs.resolve.outputs.target || inputs.group }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: bumper-${{ inputs.base || 'OCO' }}-${{ needs.resolve.outputs.mode }}-${{ needs.resolve.outputs.target || inputs.group }}
      queue: max
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
      options: --privileged
    defaults:
      run:
        working-directory: extra
    env:
      XBPS_TARGET_ARCH: x86_64
      XBPS_DISTDIR: /void-packages
      XBPS_ALLOW_CHROOT_BREAKOUT: 'yes'
      SOURCE_DATE_EPOCH: '1700000000'
      TEMPLATE: ${{ needs.resolve.outputs.template }}
      PACK: ${{ needs.resolve.outputs.pack }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      OCO_TOKEN: ${{ secrets.WORKFLOWS }}
      XBPS_SRC: /void-packages/xbps-src
      GH_REPO: ${{ github.repository }}
      BASE_REF: ${{ inputs.base || 'OCO' }}
      BRANCH_PREFIX: ${{ inputs.base == 'testing' && 'T-autobump' || 'autobump' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}
          path: extra
          ref: ${{ github.event_name == 'issues' && github.event.repository.default_branch || '' }}

      - name: Load testing package inputs
        if: inputs.base == 'testing' && needs.resolve.outputs.mode != 'group'
        run: bash .github/scripts/autobump-use-testing.sh

      - name: Configure git identity
        run: |
          git config user.name "oSoWoSo-bot"
          git config user.email "bot@osowoso.org"
          git config --global user.name "oSoWoSo-bot"
          git config --global user.email "bot@osowoso.org"
          git config --global --add safe.directory /void-packages
          git config --global --add safe.directory '*'

      - name: Merge OCO templates into XBPS checkout
        run: bash "${GITHUB_WORKSPACE}/extra/.github/scripts/build-merge-templates.sh"
        working-directory: ${{ github.workspace }}

      # ---- Package/pack mode (pkg dispatch or package-update issue) ----

      - name: Skip if dismissed or already handled
        id: marker
        if: needs.resolve.outputs.mode != 'group'
        env:
          GH_TOKEN: ${{ secrets.BOT }}
        run: bash .github/scripts/autobump-marker.sh

      - name: Blacklist check
        id: blacklist
        if: steps.marker.outputs.handled == 'false'
        env:
          FORCE: ${{ inputs.force }}
          REQUEST_VER: ${{ steps.marker.outputs.request_ver }}
        run: bash .github/scripts/autobump-blacklist.sh

      - name: Lint the single template
        id: lint-single
        if: needs.resolve.outputs.mode == 'lint' && steps.blacklist.outputs.in_list == 'true'
        env:
          PACKAGES: ${{ needs.resolve.outputs.template }}
        run: bash "${GITHUB_WORKSPACE}/extra/.github/scripts/build-lint.sh"
        working-directory: ${{ github.workspace }}

      - name: Plan the dependency batch
        id: plan
        if: needs.resolve.outputs.mode == 'autobump' && steps.blacklist.outputs.in_list == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          FORCE: ${{ inputs.force }}
        run: bash .github/scripts/autobump-plan.sh

      - name: Apply the batch
        id: apply
        if: steps.plan.outputs.bumped == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.BOT }}
        run: bash .github/scripts/autobump-apply.sh

      - name: Check whether the open PR already has this batch
        id: existing
        if: steps.apply.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          AUTOMERGE: ${{ inputs.automerge }}
        run: bash .github/scripts/autobump-existing.sh

      - name: Check OSV advisories (informational)
        id: osv
        if: steps.existing.outputs.handled == 'false'
        continue-on-error: true
        run: bash .github/scripts/autobump-osv.sh

      - name: Nothing to bump
        if: steps.plan.outputs.bumped == 'false'
        run: bash .github/scripts/autobump-nothing.sh

      - name: Create branch + push
        id: branch
        if: steps.existing.outputs.handled == 'false'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: bash .github/scripts/autobump-branch.sh

      - name: Open or update the PR
        id: pr
        if: steps.branch.outputs.branch != '' || steps.existing.outputs.retitle == 'true'
        env:
          GH_TOKEN: ${{ inputs.automerge && secrets.BOT || secrets.WORKFLOWS }}
          EXISTING_PR: ${{ steps.existing.outputs.number }}
          RETITLE: ${{ steps.existing.outputs.retitle }}
        run: bash .github/scripts/autobump-pr.sh

      - name: Comment on issue
        if: github.event_name == 'issues' && steps.apply.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
          PR_NUMBER: ${{ steps.pr.outputs.number || steps.existing.outputs.number }}
          REQUEST_VER: ${{ steps.marker.outputs.request_ver }}
        run: bash .github/scripts/autobump-comment.sh

      # ---- Group mode (workflow_dispatch without pkg) ----
      - name: Resolve paths
        id: paths
        if: needs.resolve.outputs.mode == 'group'
        run: |
          echo "sourceDir=${XBPS_DISTDIR}/srcpkgs" >> "$GITHUB_OUTPUT"
          echo "destinationDir=${GITHUB_WORKSPACE}/extra/srcpkgs" >> "$GITHUB_OUTPUT"

      - name: Ensure xxautobump
        if: needs.resolve.outputs.mode == 'group'
        shell: bash
        run: |
          if command -v xxautobump >/dev/null 2>&1; then
            echo "xxautobump already available"
            exit 0
          fi
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/Piraty/xxtools/archive/refs/heads/master.tar.gz -o "$tmp/xxtools.tar.gz"
          tar -xzf "$tmp/xxtools.tar.gz" -C "$tmp"
          install -m 0755 "$tmp"/xxtools-*/xxautobump /usr/local/bin/xxautobump
          rm -rf "$tmp"

      - name: Prepare container
        if: needs.resolve.outputs.mode == 'group'
        run: oco-prepare

      - name: Prepare sources directory
        if: needs.resolve.outputs.mode == 'group'
        run: |
          mkdir -p /host/sources
          chown -R builder:builder /host/sources

      - name: run bump.sh
        if: needs.resolve.outputs.mode == 'group'
        env:
          sourceDir: ${{ steps.paths.outputs.sourceDir }}
          destinationDir: ${{ steps.paths.outputs.destinationDir }}
        shell: bash
        run: |
          set -euo pipefail
          args=("${{ inputs.group }}")
          if [ "${{ inputs.bump }}" = "true" ]; then args+=(--bump); fi
          if [ "${{ inputs.lint }}" = "true" ]; then args+=(--lint); fi
          if [ "${{ inputs.order }}" = "true" ]; then args+=(--order); fi
          if [ "${{ inputs.record_order }}" = "true" ]; then args+=(--record-order); fi
          printf 'Running: ./bump.sh %s\n' "${args[*]}"
          ./bump.sh "${args[@]}"

      - name: Commit and push changes
        if: needs.resolve.outputs.mode == 'group'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "bump.sh: ${{ inputs.group }}"
          git push origin HEAD:${GITHUB_REF_NAME}