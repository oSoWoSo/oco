name: 🧹 cleanup
run-name: >-
  ${{
    inputs.packages != '' && format('🧹 {0}', inputs.packages) ||
    '🧹 auto-detect'
  }}
on:
  workflow_call:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        type: string
        default: ''
      repository_prefix:
        description: 'Surfer API/public path prefix (empty for production)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        default: ''
      repository_prefix:
        description: 'Surfer API/public path prefix (empty for production)'
        required: false
        type: string
        default: testing
permissions:
  contents: read
  packages: read
concurrency:
  group: cleanup-repodata
  cancel-in-progress: false

jobs:
  cleanup:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_64-musl, aarch64, aarch64-musl]
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}
          fetch-depth: 0

      - name: Refuse production cleanup from non-OCO refs
        if: inputs.repository_prefix == '' && github.ref != 'refs/heads/OCO'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/OCO ]; then
            echo "::error::Production cleanup is only allowed on OCO (got: $REF)"
            exit 1
          fi

      - name: Purge removed packages from repodata
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SURF_PURGE_PACKAGES: ${{ inputs.packages }}
          SURF_PATH_PREFIX: ${{ inputs.repository_prefix }}
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          command -v xbps-rindex >/dev/null 2>&1 || { echo "::error::xbps-rindex not found in builder image" >&2; exit 1; }
          command -v surfer >/dev/null 2>&1 || { echo "::error::surfer CLI not found in builder image" >&2; exit 1; }
          # ARCH comes from the job env; `ocoman -p` takes no argument and
          # must run from the checkout so it finds src/ and srcpkgs/. It
          # only reads BUILDDIR to pick up freshly built .xbps files; this
          # job builds nothing, so point it at an empty directory.
          mkdir -p "${RUNNER_TEMP}/empty"
          BUILDDIR="${RUNNER_TEMP}/empty" ./ocoman -p
