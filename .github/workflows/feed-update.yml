name: 📰 feed update
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no issue changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: package-update
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  TARGET_REPO: oSoWoSo/oco
  OCO_LABEL: package-update

jobs:
  package-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}

      - name: Install dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python3 -m pip install -r requirements.txt

      - name: Check package updates
        env:
          OPML_PATH: ${{ github.workspace }}/src/feed.opml
          GH_TOKEN: ${{ secrets.BOT }}
          GITHUB_TOKEN: ${{ secrets.BOT }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG }}
          GITLAB_TOKEN: ${{ secrets.GITLAB }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 src/feedsparser.py | tee -a summary
          cat summary >> ${GITHUB_STEP_SUMMARY}