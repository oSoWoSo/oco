name: lint autobump symlinks
on:
  push:
    branches: [OCO]
    paths:
      - src/autobump-pkgs
      - srcpkgs/**
      - .github/scripts/lint-autobump-symlinks.sh
      - .github/workflows/lint-autobump-symlinks.yml
  pull_request:
    paths:
      - src/autobump-pkgs
      - srcpkgs/**
      - .github/scripts/lint-autobump-symlinks.sh
      - .github/workflows/lint-autobump-symlinks.yml
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-autobump-symlinks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint src/autobump-pkgs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run symlink lint
        run: |
          .github/scripts/lint-autobump-symlinks.sh 2>&1 | tee -a TMP
          status=${PIPESTATUS[0]}
          grep -i 'error' TMP >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
