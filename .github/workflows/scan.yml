name: 🔬 update scan
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && (inputs.pkg != '' && format('🔬 {0}', inputs.pkg) ||
     '🔬 whole') ||
    github.event_name == 'schedule' && '🔬 scheduled' ||
    '🔬'
  }}
on:
  #schedule:
    #- cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Only scan this package (empty = whole whitelist)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: scan-updates
  cancel-in-progress: false

jobs:
  scan:
    name: Scan for updates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}

      - name: Detect newer versions
        id: scan
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          SCAN_PKG: ${{ inputs.pkg }}
        run: |
          set -uo pipefail

          mkdir -p out

          mapfile -t pkgs < <(
            grep -vE '^\s*(#|$)' src/autobump-pkgs
          )

          if [ -n "$SCAN_PKG" ]; then
            pkgs=("$SCAN_PKG")
          fi

          echo "Scanning ${#pkgs[@]} template(s)"

          for pkg in "${pkgs[@]}"; do
            if [ -L "srcpkgs/$pkg" ]; then
              echo "::notice::$pkg is a symlinked alias, skipping"
              continue
            fi

            if ! out=$(.github/scripts/detect-update.sh "$pkg" "$GITHUB_WORKSPACE"); then
              echo "::warning::$pkg: detection failed, skipping"
              continue
            fi

            if [ -z "$out" ]; then
              echo "$pkg: up to date"
              continue
            fi

            # "<pkg> <old> <new>"
            read -r name old new <<<"$out"
            echo "$name $old $new" >>out/found
            echo "$name: $old -> $new"
          done

          if [ ! -s out/found ]; then
            echo "Nothing to bump."
            exit 0
          fi

          echo "count=$(wc -l <out/found)" >>"$GITHUB_OUTPUT"

      - name: Open issues
        if: steps.scan.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
        run: |
          set -euo pipefail

          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/scan.yml"

          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label package-update --limit 1000 --json body,title >out/open-issues.json

          while read -r pkg old new; do
            if jq -e --arg pkg "$pkg" --arg ver "$new" \
              --arg old "$old" \
              '.[] | (.body // "") as $body | (.title // "") as $title | select(($body | contains("<!-- package-update:" + $pkg + " -->") or contains("**Package:** `" + $pkg + "`")) and ($body | contains("<!-- upstream-version:" + $ver + " -->") or contains("**Upstream version:** `" + $ver + "`") or ($title | contains($pkg + " " + $old + " -> " + $ver))))' \
              out/open-issues.json >/dev/null; then
              echo "$pkg $new: matching issue already open"
              continue
            fi

            cat >out/issue.md <<EOF
          **Package:** \`$pkg\`

          **Upstream version:** \`$new\`

          <!-- package-update:$pkg -->
          <!-- upstream-version:$new -->

          A newer upstream release is available.

          | Current | Latest |
          |---|---|
          | \`$old\` | \`$new\` |

          Autobump opens a pull request for this automatically. Comment
          \`nobump\` here to dismiss it.

          _Opened by [\`scan.yml\`]($workflow_url)._
          EOF

            issue=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "package-update: $pkg $old -> $new" \
              --label package-update \
              --body-file out/issue.md)

            echo "$pkg -> ${issue:-FAILED}"
          done <out/found

      - name: Summary
        run: |
          {
            echo "# Update scan"
            echo
            if [ -s out/found ]; then
              echo "| Package | Current | Latest |"
              echo "|---|---|---|"
              while read -r pkg old new; do
                echo "| \`$pkg\` | $old | **$new** |"
              done <out/found
            else
              echo "All whitelisted templates are up to date."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
