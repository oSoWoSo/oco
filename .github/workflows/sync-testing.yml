name: 🔄 sync testing branch

# Rebase testing on top of the latest OCO, invoked as a reusable workflow by
# build.yml right before a build that needs the testing branch. testing
# templates need OCO's updated base (common shlibs, hostmakedepends, XBPS
# infra) to build against. There is no schedule and no rebase on every OCO
# push: testing stays stale until a build from the testing branch actually
# needs the fresh base.
#
# The rebase preserves every testing-only commit/file; it never creates a
# commit message and never deletes a testing change. On conflict it halts with
# a non-zero exit so the caller's build is blocked until a maintainer resolves
# the conflict manually.
on:
  workflow_call:
    outputs:
      testing_head:
        description: SHA of the rebased testing branch after the sync (the
          fresh base a testing-targeted build should run against).
        value: ${{ jobs.rebase.outputs.testing_head }}

permissions:
  contents: write

jobs:
  rebase:
    name: Rebase testing on latest OCO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      testing_head: ${{ steps.rebase.outputs.testing_head }}
    steps:
      - name: Checkout OCO
        uses: actions/checkout@v7
        with:
          ref: OCO
          path: oco
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch testing branch
        run: |
          set -euo pipefail
          git -C oco fetch --no-tags origin +refs/heads/testing:refs/remotes/origin/testing

      - name: Rebase testing on top of the new OCO head
        id: rebase
        run: |
          set -euo pipefail
          git -C oco checkout -B testing origin/testing
          git -C oco rebase origin/OCO
          echo "testing_head=$(git -C oco rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Push rebased testing branch
        run: |
          set -euo pipefail
          old_head="$(git -C oco rev-parse origin/testing)"
          git -C oco push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/testing" --force-with-lease="refs/heads/testing:${old_head}"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS }}
