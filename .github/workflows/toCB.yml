name: 🫸Codeberg
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  push-to-codeberg:
    name: 🫸Codeberg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CODEBERG_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Push branch to Codeberg
        env:
          CODEBERG_REPO: ${{ vars.CODEBERG_REPO }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git remote add codeberg "$CODEBERG_REPO"
          git push codeberg "HEAD:refs/heads/$BRANCH" --force
