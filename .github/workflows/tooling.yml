name: 🧰 tooling
run-name: >-
  ${{
    github.event_name == 'push' && format('🧰 {0}', github.event.head_commit.message) ||
    github.event_name == 'pull_request' && format('🧰 {0} (#{1})', github.event.pull_request.title, github.event.pull_request.number) ||
    '🧰'
  }}
on:
  push:
    branches: [OCO]
    paths:
      - 'ocoman'
      - '.gitignore'
      - 'src/build.yml.in'
      - 'src/*.sh'
      - 'src/*.py'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ocoman'
      - '.gitignore'
      - 'src/build.yml.in'
      - 'src/*.sh'
      - 'src/*.py'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read

jobs:
  helper-tests:
    name: 🧰
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}
      - name: Run helper tests
        run: sh tests/run.sh
