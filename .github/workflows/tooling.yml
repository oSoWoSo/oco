name: 🧰 tooling
run-name: >-
  ${{
    github.event_name == 'push' && format('🧰 {0}', github.event.head_commit.message) ||
    github.event_name == 'pull_request' && format('🧰 {0} (#{1})', github.event.pull_request.title, github.event.pull_request.number) ||
    '🧰'
  }}
on:
  push:
    branches: [OCO]
    paths:
      - 'ocoman'
      - '.gitignore'
      - 'src/autobump-blacklist'
      - 'src/*.sh'
      - 'src/*.py'
      - 'src/*.js'
      - 'src/*.css'
      - 'src/*.html'
      - 'srcpkgs/**'
      - '.github/osv-identities.json'
      - '.github/actionlint.yaml'
      - 'requirements.txt'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ocoman'
      - '.gitignore'
      - 'src/autobump-blacklist'
      - 'src/*.sh'
      - 'src/*.py'
      - 'src/*.js'
      - 'src/*.css'
      - 'src/*.html'
      - 'srcpkgs/**'
      - '.github/osv-identities.json'
      - '.github/actionlint.yaml'
      - 'requirements.txt'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    name: Run tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT || github.token }}
      - name: Lint autobump template symlinks
        run: bash .github/scripts/ci/lint-autobump-symlinks.sh
      - name: Check website JavaScript syntax
        run: node --check src/main.js
      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          python3 -m pip install -r tests/requirements.txt
      - name: Run helper tests
        run: sh tests/run.sh
