name: ⏫ update
run-name: >-
  ${{
    github.event_name == 'push' && format('⏫ {0}', github.event.head_commit.message) ||
    github.event_name == 'workflow_dispatch' && '⏫ manual' ||
    '⏫'
  }}
on:
  push:
    branches: [OCO]
    paths:
      - 'srcpkgs/**'
      - 'src/build.yml.in'
      - 'ocoman'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  packages: read
concurrency:
  group: update-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Regenerate repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publishing from non-OCO refs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = OCO || { echo "::error::update workflow_dispatch is only allowed on OCO (got: $REF_NAME)"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOWS }}
          fetch-depth: 2

      - name: Regenerate repository metadata
        run: ./ocoman -u

      - name: Commit generated metadata
        id: commit
        run: |
          set -euo pipefail
          git config user.name "oSoWoSo-bot"
          git config user.email "mail@osowoso.org"
          git add .gitignore README.md .github/workflows/build.yml Manual.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: update"
            git push
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create main-index request
        env:
          SHA: ${{ steps.commit.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/surfer-publication"
          python3 - "$RUNNER_TEMP/surfer-publication/manifest.json" "$SHA" "$RUN_ID" <<'PY'
          import json, sys
          json.dump({"schema_version": 1, "destination": "production", "source_sha": sys.argv[2], "source_run_id": sys.argv[3], "package_arches": [], "result_arches": [], "purge_packages": [], "update_arch_pages": False, "update_feed": False, "update_main_index": True}, open(sys.argv[1], "w"))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: surfer-publication
          path: ${{ runner.temp }}/surfer-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: request
    uses: ./.github/workflows/write-surfer.yml
    with:
      destination: production
      artifact_name: surfer-publication
    secrets: inherit
