name: ⏫ update
run-name: >-
  ${{
    github.event_name == 'push' && format('⏫ {0}', github.event.head_commit.message) ||
    github.event_name == 'workflow_dispatch' && '⏫ manual' ||
    '⏫'
  }}
on:
  push:
    branches: [OCO]
    paths:
      - 'srcpkgs/**'
      - 'src/build.yml.in'
      - 'ocoman'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  list-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publishing from non-OCO refs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != OCO ]; then
            echo "::error::update workflow_dispatch is only allowed on OCO (got: $REF_NAME)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOWS }}
          fetch-depth: 2

      - name: Update repo
        run: ./ocoman -u

      - name: Regenerate and upload main page
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
        run: |
          set -euo pipefail
          sudo apt-get install -y pandoc nodejs
          sudo npm -g install @cloudron/surfer
          ./ocoman -m
          echo "Published to https://repo.osowoso.org/" >> $GITHUB_STEP_SUMMARY

          git config --global user.name "oSoWoso-bot"
          git config --global user.email "mail@osowoso.org"
          # Fail loudly if any of these files is missing -- they are all
          # regenerated by `ocoman -u` and a missing one means a bug.
          git add .gitignore README.md .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "CI: update"
          git push
          git status
