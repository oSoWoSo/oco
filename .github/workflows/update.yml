name: ⏫ update
run-name: >-
  ${{
    github.event_name == 'push' && format('⏫ {0}', github.event.head_commit.message) ||
    github.event_name == 'workflow_dispatch' && '⏫ manual' ||
    '⏫'
  }}
on:
  push:
    branches: [OCO]
    paths:
      - 'srcpkgs/**'
      - 'src/build.yml.in'
      - 'ocoman'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  packages: read
concurrency:
  group: update-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Regenerate repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Refuse publishing from non-OCO refs
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = OCO || { echo "::error::update workflow_dispatch is only allowed on OCO (got: $REF_NAME)"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOWS }}
          fetch-depth: 2

      - name: Regenerate repository metadata
        run: ./ocoman -u

      - name: Commit generated metadata and create main-index request
        id: commit
        env:
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/ci/update-metadata.sh

      - uses: actions/upload-artifact@v7
        with:
          name: surfer-publication
          path: ${{ runner.temp }}/surfer-publication
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: request
    uses: ./.github/workflows/write-surfer.yml
    with:
      destination: production
      artifact_name: surfer-publication
    secrets: inherit
